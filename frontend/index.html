<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendly" />
    <link rel="apple-touch-icon" href="/icon-maskable.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Spendly</title>
    <script>
      // Keep these colors in sync with --background in index.css. Themes: 'dark' (default),
      // 'dim' (soft dark), 'light' (Latte, :root) and 'dawn' (warm paper). dark and dim get the
      // .dark class. The installed (standalone) app keeps the dark status-bar color in every
      // theme: Android paints its status bar from the manifest's fixed dark color and only uses
      // theme-color to pick light vs dark icons — a light theme-color there means dark icons on a
      // black bar, i.e. invisible. See ThemeContext.
      var standalone = window.matchMedia('(display-mode: standalone)').matches;
      var theme = localStorage.getItem('spendly_theme');
      if (theme === 'cream') theme = 'dawn'; // renamed
      if (theme !== 'light' && theme !== 'dawn' && theme !== 'dim') theme = 'dark';
      document.documentElement.dataset.theme = theme;
      if (theme === 'dark' || theme === 'dim') {
        document.documentElement.classList.add('dark');
      }
      if (!standalone && theme !== 'dark') {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', { light: '#e6e9ef', dawn: '#f2e9e1', dim: '#232634' }[theme]);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
