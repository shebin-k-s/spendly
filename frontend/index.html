<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendly" />
    <link rel="apple-touch-icon" href="/icon-maskable.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Spendly</title>
    <script>
      // Keep these two colors in sync with --background in index.css.
      // The installed (standalone) app keeps the dark color in light mode too:
      // Android paints its status bar from the manifest's fixed dark color and
      // only uses theme-color to pick light vs dark icons — a light theme-color
      // there means dark icons on a black bar, i.e. invisible. See ThemeContext.
      var standalone = window.matchMedia('(display-mode: standalone)').matches;
      if (localStorage.getItem('spendly_theme') === 'light') {
        if (!standalone) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
