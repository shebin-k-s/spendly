<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendly" />
    <link rel="apple-touch-icon" href="/icon-maskable.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Spendly</title>
    <script>
      // Keep these colors in sync with --background in index.css (light = :root, cream =
      // :root[data-theme='cream']). Themes: 'dark' (default), 'light' (Cool sky), 'cream'.
      // The installed (standalone) app keeps the dark color in light themes too:
      // Android paints its status bar from the manifest's fixed dark color and
      // only uses theme-color to pick light vs dark icons — a light theme-color
      // there means dark icons on a black bar, i.e. invisible. See ThemeContext.
      var standalone = window.matchMedia('(display-mode: standalone)').matches;
      var theme = localStorage.getItem('spendly_theme');
      if (theme !== 'light' && theme !== 'cream') theme = 'dark';
      document.documentElement.dataset.theme = theme;
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else if (!standalone) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'cream' ? '#f5f4f1' : '#f6f4f8');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
